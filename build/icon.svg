<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Muster</title>
  <desc id="desc">Four rounded agent markers assembled around a rally point, on a dark app tile — the Muster mark.</desc>

  <defs>
    <clipPath id="tile"><rect width="1024" height="1024" rx="230.4" /></clipPath>

    <radialGradient id="tile-bg" cx="50%" cy="50%" r="75%">
      <stop offset="0"    stop-color="#202227" />
      <stop offset="0.56" stop-color="#131419" />
      <stop offset="1"    stop-color="#090a0d" />
    </radialGradient>

    <linearGradient id="rally-accent" x1="10%" y1="0%" x2="95%" y2="100%">
      <stop offset="0"   stop-color="#FF7A45" />
      <stop offset="0.5" stop-color="#F0460E" />
      <stop offset="1"   stop-color="#C93A0B" />
    </linearGradient>
  </defs>

  <!-- macOS icon grid: the tile sits inside an 824x824 area within the 1024
       canvas (a full-bleed tile renders larger than every other Dock icon). -->
  <g transform="translate(100 100) scale(0.8046875)">
    <g clip-path="url(#tile)">
      <rect width="1024" height="1024" fill="url(#tile-bg)" />

      <!-- rally-point marker at the tile's true centre -->
      <circle cx="512" cy="512" r="108" fill="url(#rally-accent)" />

      <!-- four agent markers assembled around the rally point -->
      <g fill="#F5F5F5">
        <circle cx="512" cy="188" r="94" />
        <circle cx="836" cy="512" r="94" />
        <circle cx="512" cy="836" r="94" />
        <circle cx="188" cy="512" r="94" />
      </g>

      <!-- connecting spokes: each agent reporting to the rally point -->
      <g stroke="#F0460E" stroke-width="16" stroke-linecap="round">
        <line x1="512" y1="282" x2="512" y2="404" />
        <line x1="742" y1="512" x2="620" y2="512" />
        <line x1="512" y1="742" x2="512" y2="620" />
        <line x1="282" y1="512" x2="404" y2="512" />
      </g>
    </g>
  </g>
</svg>
