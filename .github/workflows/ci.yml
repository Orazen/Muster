name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  # The browser instrument compiles under its own tsconfig (DOM lib) and has
  # shipped defects main's typecheck never saw (TS2362 on performance.memory
  # compiled fine for the web project). Gate it separately.
  e2e-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: npx tsc --noEmit -p tsconfig.e2e.json

  # Every spec owns its server/data/browser context. Build first so these
  # exercise this commit's UI, never a stale dist directory or a live account.
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm test:e2e

  # The suite is one serial job today: `fileParallelism: false` in vite.config.ts
  # runs 418 files one at a time, and the measured total is ~12 minutes. Split
  # it across four runners, which is where the wall clock actually goes.
  #
  # What this deliberately does NOT change: fileParallelism stays false inside
  # every shard, so each shard is still strictly serial and keeps whatever
  # determinism the suite has today. Sharding is the runner boundary, not a
  # change in how tests share a machine. 44 of those files spawn a real
  # `node server/index.ts` (10,752 lines, type-stripped at runtime), which is
  # most of the cost — and that load is exactly what makes in-process
  # parallelism flaky, so parallelism is bought here rather than assumed.
  #
  # Measured on one shard: 108 files / 1674 tests / 231 s, so four in parallel
  # land near 4 minutes against 12. Shard balance is vitest's own, not a
  # hand-maintained list, so adding a slow test file cannot silently unbalance
  # it.
  test-shard:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: npx vitest run --shard=${{ matrix.shard }}/4

  # `pnpm test` is not only vitest: it also runs the broker, the updater
  # coordinator, the desktop lifecycle and the packaged-server check, and the
  # last one builds the server first. Those stay in one job so the build they
  # depend on happens exactly once, and so a failure in any of them still
  # reads as its own named job rather than as a mysterious shard.
  test-integrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm broker:test
      - run: pnpm test:updater
      - run: pnpm test:desktop-lifecycle
      - run: pnpm test:packaged-server

  # The companion's portable core: 537 XCTest cases covering the wire models,
  # the SSE parser, the state fold, the composer and seed fences, approval
  # receipts, the watch handoff, and inbound share intake. `swift test` is
  # exactly the command TESTING.md stage 1 tells a new machine to run, so CI
  # runs the same thing a person would.
  #
  # WHY THIS NEEDS A DIFFERENT RUNNER. Every other job here is Node on
  # ubuntu-latest, and Swift does not exist there. This job is the only place
  # a change to ios/Sources/CompanionCore can fail a pull request — before it
  # landed, the entire iOS test suite was documentation, not a gate, and a
  # wire-model regression could only be found by whoever remembered to run it.
  #
  # COST. This is the one job in the workflow that needs a macOS runner, and
  # macOS runners are billed at multiples of the Linux rate (roughly 10x on
  # GitHub-hosted macOS, and they are arm64 by default). It is a single,
  # short job — `swift test` for the package is seconds once the toolchain is
  # warm, and the package has no external dependencies to fetch — but it does
  # move the workflow off a purely Linux bill. That is a deliberate trade:
  # an unverified mobile core is the more expensive risk, because nothing else
  # in this workflow can see it.
  #
  # WHAT IT DOES NOT COVER. This builds and tests the `ios` package only. It
  # does not build `ios/App`, `ios/Watch`, or the extensions, so it would not
  # catch a break in the app target, the share extension, the watch target, or
  # the XcodeGen spec. Those need a simulator and are tracked separately in
  # TESTING.md; making them a gate means `xcodebuild` on a runner with a
  # simulator runtime, which is a larger change than adding a job.
  #
  # The final build waits for this core check as well as browser execution.
  swift-tests:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      # The package declares macOS 13, iOS 17 and watchOS 10, and
      # `swift test` builds the host macOS slice of CompanionCore — the UI-free
      # part, which is exactly the part intended to be testable without Xcode.
      # macos-15 is pinned rather than `-latest` on purpose: a runner image
      # bump that changes the Swift version should show up as a reviewable
      # diff, not as a surprise the day the suite goes red.
      - name: Show the toolchain
        run: swift --version
      - name: Build the package
        run: swift build --package-path ios
      - name: Run the core tests
        run: swift test --package-path ios

  build:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, e2e-typecheck, browser-tests, test-shard, test-integrations, swift-tests]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # No upload-artifact here: releases stage assets through the draft
      # release in release.yml, and artifact uploads on this private repo
      # keep tripping the storage quota (recalculated only every 6-12h),
      # which fails CI even when the build itself is green.
      - run: pnpm build
