# Release workflow — triggered by v* tags, builds all platforms, creates
# a GitHub Release with every artifact and the auto-update YML files.
#
# macOS code signing: set these repository secrets if you have an Apple
# Developer certificate. The build still works without them (unsigned),
# but auto-update on macOS requires a signed+notarized build.
#
# Required secrets (Settings → Secrets → Actions):
#   APPLE_CERTIFICATE          — Base64-encoded .p12 certificate
#   APPLE_CERTIFICATE_PASSWORD — Password for the .p12
#   APPLE_ID                   — Apple ID email for notarization
#   APPLE_APP_PASSWORD         — App-specific password for notarization
#   APPLE_TEAM_ID              — 10-char team identifier
name: Release

on:
  push:
    tags:
      - "v*"

# Least privilege: only the publish job writes back. Build jobs read.
permissions:
  contents: read

env:
  NODE_VERSION: "24"

jobs:
  # ── macOS ──────────────────────────────────────────────────────────────
  macos:
    name: macOS (arm64)
    runs-on: macos-latest
    timeout-minutes: 45
    # Job-level env, NOT step-level: a step's own `env:` block is out of scope
    # for that step's `if:` expression, so testing it there silently skipped
    # signing and notarization on every run.
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Code signing (optional — skipped if secrets are not set)
      - name: Import Apple certificate
        if: ${{ env.APPLE_CERTIFICATE != '' }}
        run: |
          # Create a temporary keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import the certificate
          CERT_PATH=$RUNNER_TEMP/certificate.p12
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$CERT_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      # electron-builder auto-discovers keychain identities by default. On a
      # bare runner (no APPLE_CERTIFICATE imported) that still produces a
      # broken partial/ad-hoc signature — hardenedRuntime+entitlements in
      # electron-builder.yml need a real identity to apply correctly, and
      # without one the result is a *worse* state than fully unsigned: macOS
      # reports "code has no resources but signature indicates they must be
      # present" and Gatekeeper's "damaged" message, even after xattr -cr.
      # Force a clean, fully unsigned build when there's no real cert, so
      # users hit the one well-understood "unsigned app" flow instead.
      - name: Build (macOS)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ env.APPLE_CERTIFICATE != '' && 'true' || 'false' }}
        run: pnpm package:mac

      # Notarization (optional — skipped if secrets are not set)
      - name: Notarize
        if: ${{ env.APPLE_ID != '' }}
        run: |
          set -euo pipefail
          DMG=$(ls release/*.dmg | head -1)
          # `notarytool` is an xcrun subcommand, not a bare executable.
          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$DMG"

      # Fail loudly if signing was configured but did not take, rather than
      # shipping a build that Gatekeeper rejects and auto-update cannot apply.
      - name: Verify signature
        if: ${{ env.APPLE_CERTIFICATE != '' }}
        run: |
          set -euo pipefail
          APP=$(ls -d release/mac*/Muster.app | head -1)
          codesign --verify --deep --strict --verbose=2 "$APP"
          spctl --assess --type exec -vv "$APP"

      # Clean up keychain
      - name: Clean up keychain
        if: always() && env.KEYCHAIN_PATH != ''
        run: security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true

      # electron-builder emits Muster-${version}.dmg, but the README and the
      # landing page link to /releases/latest/download/Muster.dmg — a STABLE
      # name. Without this copy that button is a 404.
      - name: Copy to stable download name
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          cp "release/Muster-${VERSION}.dmg" release/Muster.dmg

      - name: Verify artifacts
        run: |
          set -euo pipefail
          echo "=== macOS artifacts ==="
          ls -lh release/*.dmg release/*.zip release/*.yml 2>/dev/null
          # Ensure latest-mac.yml exists (required for auto-update)
          [ -f "release/latest-mac.yml" ] || { echo "::error::missing latest-mac.yml"; exit 1; }
          # Ensure the stable download name the README points at exists
          [ -f "release/Muster.dmg" ] || { echo "::error::missing Muster.dmg"; exit 1; }

      - name: Add stable-filename copy for the /latest/download/ badge
        run: |
          VERSION=$(node -p "require('./package.json').version")
          src="release/Muster-${VERSION}.dmg"
          if [ -f "$src" ]; then
            cp "$src" release/Muster.dmg
          else
            echo "::error::expected $src (from electron-builder.yml dmg.artifactName) — README/Homebrew cask 'latest' link will 404"
            exit 1
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-artifacts
          path: |
            release/*.dmg
            release/*.zip
            release/latest-mac.yml
          if-no-files-found: error
          retention-days: 14

  # ── macOS (Intel / x64) ──────────────────────────────────────────────────
  # Same afterPack ad-hoc re-sign as arm64 (build/after-pack-mac.mjs); no
  # Developer ID cert here either, so this deliberately skips notarization
  # and does NOT merge into latest-mac.yml — that file drives in-app auto-
  # update, and merging a second architecture into it needs its own
  # verification pass so it can't silently break arm64's auto-update, which
  # already works. This ships x64 as a real, direct download only; wiring it
  # into auto-update is a separate, scoped follow-up.
  macos-x64:
    name: macOS (x64 / Intel)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install the x64 CUA native package
        run: pnpm add -D @trycua/cua-driver-darwin-x64@0.20.0
      - name: Build (macOS x64)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: pnpm package:mac:x64

      - name: Verify artifacts
        run: |
          set -euo pipefail
          echo "=== macOS x64 artifacts ==="
          ls -lh release/*.dmg release/*.zip 2>/dev/null
          VERSION=$(node -p "require('./package.json').version")
          [ -f "release/Muster-${VERSION}-intel.dmg" ] || { echo "::error::missing Muster-${VERSION}-intel.dmg"; exit 1; }

      - name: Add stable-filename copy
        run: |
          set -euo pipefail
          cp "release/Muster-$(node -p "require('./package.json').version")-intel.dmg" release/Muster-intel.dmg

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-x64-artifacts
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error
          retention-days: 14

  # ── Windows ────────────────────────────────────────────────────────────
  windows:
    name: Windows (x64)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: clean build outputs
        shell: bash
        run: rm -rf dist dist-server release
      - run: pnpm package:win

      - name: Verify packaged tree
        shell: bash
        run: |
          res=release/win-unpacked/resources
          [ -f "$res/server/index.js" ] || { echo "::error::missing server/index.js"; exit 1; }
          [ -f "$res/ui/index.html" ] || { echo "::error::missing ui/index.html"; exit 1; }
          [ -f "$res/app-update.yml" ] || { echo "::error::missing app-update.yml"; exit 1; }

      - name: Start packaged server
        shell: bash
        run: |
          res=release/win-unpacked/resources
          HOME="$RUNNER_TEMP/omb-smoke" USERPROFILE="$RUNNER_TEMP/omb-smoke" \
            OMB_PORT=21987 node "$res/server/index.js" > "$RUNNER_TEMP/server.log" 2>&1 &
          pid=$!
          for _ in $(seq 1 90); do
            if curl -fsS --max-time 2 http://127.0.0.1:21987/api/health >/dev/null 2>&1; then
              echo "packaged server answered /api/health ✓"
              kill $pid 2>/dev/null || true
              exit 0
            fi
            kill -0 $pid 2>/dev/null || break
            sleep 1
          done
          echo "::error::packaged server never served /api/health"
          cat "$RUNNER_TEMP/server.log" || true
          kill $pid 2>/dev/null || true
          exit 1

      # nsis.artifactName is Muster-${version}-setup.exe — there is no "-x64-"
      # segment. The old copy referenced one, failed every run, and `|| true`
      # hid it, so Muster-setup.exe was never published and the README's
      # download button 404'd. No error suppression here: a mismatch must fail.
      - name: Copy to stable download name
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          # electron-builder.yml's win.nsis.artifactName is
          # "Muster-${version}-setup.${ext}" (no "-x64" — do not add one here,
          # a previous version of this step silently no-op'd on a wrong glob).
          src="release/Muster-${VERSION}-setup.exe"
          if [ -f "$src" ]; then
            cp "$src" release/Muster-setup.exe
          else
            echo "::error::expected $src (from electron-builder.yml nsis.artifactName) — README's 'latest' download badge will 404"
            ls -lh release/*.exe 2>/dev/null || true
            exit 1
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-artifacts
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
          if-no-files-found: error
          retention-days: 14

  # ── Linux ──────────────────────────────────────────────────────────────
  linux:
    name: Linux (x64)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install desktop utilities
        run: sudo apt-get update && sudo apt-get install -y desktop-file-utils
      - run: pnpm package:linux

      - name: Verify artifacts
        run: |
          echo "=== Linux artifacts ==="
          ls -lh release/*.AppImage release/*.deb 2>/dev/null

      - name: Add stable-filename copies for the /latest/download/ links
        run: |
          deb=$(ls release/*.deb | head -1)
          appimage=$(ls release/*.AppImage | head -1)
          [ -f "$deb" ] && cp "$deb" release/Muster.deb
          [ -f "$appimage" ] && cp "$appimage" release/Muster.AppImage

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-artifacts
          path: |
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
          retention-days: 14

  # ── Create GitHub Release ──────────────────────────────────────────────
  publish:
    name: Create Release
    needs: [macos, macos-x64, windows, linux]
    if: ${{ !cancelled() && (needs.macos.result == 'success' || needs.linux.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The only job that needs write access.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts

      - name: List all artifacts
        run: find artifacts -type f | sort

      # A partial release is allowed, but installed clients on the missing
      # platform would poll a release with no latest*.yml manifest and fail
      # their update check. Publish those as a draft so a human confirms.
      # macos-x64 is deliberately NOT one of the required platforms here —
      # it's the newest, least-proven leg of this workflow, and a failure
      # in it alone shouldn't turn every release into a draft the way a
      # failure in the three platforms every release has always needed
      # would. It's still fetched below and included in the release when
      # it succeeded; when it didn't, the release just ships without an
      # Intel build that checkpoint, same as any other best-effort artifact.
      - name: Decide draft state
        id: draft
        run: |
          set -euo pipefail
          if [ "${{ needs.macos.result }}" != "success" ] \
            || [ "${{ needs.windows.result }}" != "success" ] \
            || [ "${{ needs.linux.result }}" != "success" ]; then
            echo "::warning::not every platform built — publishing as a draft"
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi
          if [ "${{ needs.macos-x64.result }}" != "success" ]; then
            echo "::warning::macOS x64 build did not succeed — releasing without it"
          fi

      - name: Verify stable download names are present
        if: ${{ steps.draft.outputs.value == 'false' }}
        run: |
          set -euo pipefail
          # These exact filenames are what README.md and www/index.html link to.
          [ -f artifacts/macos-artifacts/Muster.dmg ] \
            || { echo "::error::Muster.dmg missing — the README download button would 404"; exit 1; }
          [ -f artifacts/windows-artifacts/Muster-setup.exe ] \
            || { echo "::error::Muster-setup.exe missing — the README download button would 404"; exit 1; }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8 # v2.3.2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: ${{ steps.draft.outputs.value }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            artifacts/macos-artifacts/*
            artifacts/macos-x64-artifacts/*
            artifacts/windows-artifacts/*
            artifacts/linux-artifacts/*
