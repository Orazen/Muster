# ═════════════════════════════════════════════════════════════════════════════
# Release pipeline — gate pattern ported from OpenMausBot's signed release flow
#
# One commit → every platform → verified → assembled → published. Triggered by
# v* tag pushes, or run manually from Actions → Release → Run workflow:
# leave "dry_run" TICKED (the default) to exercise the entire pipeline — every
# build and every gate without release uploads or notarization submissions.
# Untick it to release an existing version tag that matches the selected commit.
#
# Every gate below exists because its absence shipped (or nearly shipped) a
# broken build. Ordering matters:
#   clean output dirs         → stale dist/ would ride along into the sealed
#                               app (the "damaged app" class of incident)
#   codesign gate BEFORE      → notarization ACCEPTS invalid signatures;
#                               notarize                  verifying first is the only thing that catches them
#   packaged-server smoke     → index.js EXISTING ≠ index.js RUNNING; a bare
#                               import kills the packaged server while every
#                               existence check stays green
#   staple, THEN checksums    → stapling rewrites bytes; hashes computed
#                               earlier describe files nobody ships
#   assemble-then-publish     → a partial platform set publishes as a DRAFT
#                               for human review, never silently
#   feed-vs-bytes verify      → a latest*.yml whose sha512 doesn't match the
#                               shipped bytes makes electron-updater reject
#                               every update
#
# Deliberate scope limit: the macOS ZIP is never modified after electron-
# builder writes latest-mac.yml (no re-zipping a stapled .app here). Restapling
# into the zip invalidates the feed hash and strands every installed Mac —
# refresh-mac-feed updates only post-staple DMG hashes and rejects any ZIP
# byte change. It never re-zips or silently rewrites a changed ZIP hash.
#
# REQUIRED SECRETS (Settings → Secrets and variables → Actions; names only,
# values never in this file). Absent-secret behavior is stated per group so
# unsigned forks still get artifacts:
#
#   macOS code signing — BOTH absent → fully unsigned builds (forced clean
#   unsigned state, not the broken half-signed one; users get the normal
#   "unidentified developer" right-click-open flow):
#     APPLE_CERTIFICATE            Base64-encoded .p12 Developer ID certificate
#     APPLE_CERTIFICATE_PASSWORD   Export password for that .p12
#
#   macOS notarization — ANY absent → skip notarize/staple; signed-but-
#   unstapled (or unsigned) artifacts still upload. Uses the App Store
#   Connect API key, NOT an Apple ID app-specific password: the API key is
#   the credential this team can actually mint and rotate without a browser,
#   and notarytool accepts it identically.
#     ASC_KEY_ID                   App Store Connect key id (e.g. Z8854APF6U)
#     ASC_ISSUER_ID                Issuer UUID from the same Keys page
#     ASC_KEY_CONTENT              The .p8 private key, verbatim
#     APPLE_TEAM_ID                10-char Apple team identifier
#
#   Windows signing — BOTH absent → unsigned NSIS (SmartScreen "unknown
#   publisher", documented in README); BOTH present → electron-builder signs
#   at pack time and the packaged-tree gate then REQUIRES publisherName in
#   app-update.yml (its absence would make electron-updater reject updates):
#     CSC_LINK                     Base64 .p12 (standard electron-builder name)
#     CSC_KEY_PASSWORD             Password for that .p12
#
#   Publishing uses the workflow's own GITHUB_TOKEN (contents: write is also
#   needed by draft preparation and platform uploads). No Android release
#   target is built by this workflow.
#
# Idempotence: all release runs queue together (concurrency), every
# build job wipes generated output first, installs are --frozen-lockfile, and
# a non-draft release is refused if v<version> is already published.
# ═════════════════════════════════════════════════════════════════════════════
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit/tag/branch to build (defaults to the branch this runs from)"
        required: false
        type: string
      dry_run:
        description: "Build and validate only — no release uploads, public mirror writes, or notarization submissions"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: muster-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  NODE_VERSION: "24"

jobs:
  # ── Pin the release commit ────────────────────────────────────────────────
  # All build legs check out THIS sha, so every artifact provably comes from
  # one commit even if refs move mid-run.
  prepare:
    name: Pin the release commit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      sha: ${{ steps.pin.outputs.sha }}
      version: ${{ steps.pin.outputs.version }}
      dry_run: ${{ steps.pin.outputs.dry_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - id: pin
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: node scripts/release-policy.mjs pin
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint the selected release commit
        id: lint
        run: pnpm lint
      - name: Typecheck the selected release commit
        id: typecheck
        run: pnpm typecheck
      - name: Test the selected release commit
        id: tests
        run: pnpm exec vitest run
      - name: Test the connection broker
        id: broker
        run: pnpm broker:test
      - name: Verify updater behavior
        id: updater
        run: pnpm test:updater
      - name: Check Electron entry points
        id: electron-syntax
        run: pnpm check:electron
      - name: Prepare the verified staging release
        id: staging
        if: ${{ success() && steps.pin.outputs.dry_run == 'false' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.pin.outputs.version }}
          RELEASE_SHA: ${{ steps.pin.outputs.sha }}
        run: node scripts/release-state.mjs prepare

  # ── macOS arm64 ───────────────────────────────────────────────────────────
  # Order: clean → sign-config → package → SIGNATURE GATE → packaged smoke →
  # notarize+staple → post-staple hashes. Notarization is last because it
  # accepts signatures that codesign rejects, and checksums are last because
  # stapling rewrites bytes.
  macos:
    name: macOS arm64 (sign, notarize, staple)
    needs: prepare
    runs-on: macos-latest
    timeout-minutes: 60
    # Job-level env, NOT step-level: a step's own `env:` block is out of scope
    # for that step's `if:` expression, so testing secrets there silently
    # skipped signing on every run.
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      # Notarization credentials. The App Store Connect API key replaces the
      # Apple ID + app-specific-password pair: notarytool accepts either, and
      # the API key is the one this team can create and revoke without the
      # Apple ID account page.
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
      # The full "Developer ID Application: NAME (TEAMID)" string. afterPack
      # writes it into the trusted-mac-updates marker, which is what unlocks
      # in-place Squirrel.Mac updates; without it every install stays on the
      # direct-download flow. Not used as CSC_NAME — electron-builder rejects
      # the "Developer ID Application:" prefix there and picks the identity
      # from the imported keychain instead.
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4.2.0
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: macos-electron-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: macos-electron-
      - run: pnpm install --frozen-lockfile

      # Generated output must be rebuilt, never inherited: a stale dist/ or
      # dist-server/ gets sealed into the app and the smoke below can't tell
      # fresh-from-source from leftover.
      - name: Clean generated output
        run: |
          set -euo pipefail
          rm -rf dist dist-server dist-companion dist-native release

      # Code signing (optional — skipped if secrets are not set)
      - name: Import Apple certificate
        if: ${{ env.APPLE_CERTIFICATE != '' }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          CERT_PATH=$RUNNER_TEMP/certificate.p12
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$CERT_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          rm "$CERT_PATH"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      # electron-builder auto-discovers keychain identities by default. On a
      # bare runner (no APPLE_CERTIFICATE imported) that produces a broken
      # partial/ad-hoc signature — hardenedRuntime+entitlements need a real
      # identity, and without one the result is a *worse* state than fully
      # unsigned: Gatekeeper reports the app as damaged. Force a clean, fully
      # unsigned build when there's no real cert.
      - name: Build (macOS arm64)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ env.APPLE_CERTIFICATE != '' && 'true' || 'false' }}
          MAC_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
        run: pnpm package:mac:arm64

      - name: "Gate: signature must verify BEFORE notarization"
        if: ${{ env.APPLE_CERTIFICATE != '' }}
        run: |
          set -euo pipefail
          # notarytool ACCEPTS binaries codesign rejects — this gate is the
          # only chance to catch a bad seal before it's notarized. Verifying
          # the seal is NOT enough: an "Apple Development" signature verifies
          # cleanly and is still not distributable, which is how the 1.12.1
          # mirror shipped a DMG Gatekeeper rejects on every other Mac.
          # Assert the AUTHORITY and the hardened runtime too.
          APP=release/mac-arm64/Muster.app
          codesign --verify --deep --strict "$APP"
          AUTHORITY=$(codesign -dv --verbose=4 "$APP" 2>&1 | awk -F= '/^Authority=Developer ID Application/ {print $2; exit}')
          if [ -z "$AUTHORITY" ]; then
            FOUND=$(codesign -dv --verbose=4 "$APP" 2>&1 | awk -F= '/^Authority=/ {print $2; exit}')
            echo "::error::$APP is not Developer ID signed (found: ${FOUND:-none})"
            exit 1
          fi
          codesign -dv --verbose=4 "$APP" 2>&1 | grep -q 'flags=0x10000(runtime)' || {
            echo "::error::$APP was not built with the hardened runtime"
            exit 1
          }
          echo "ok: signature verifies, Developer ID signed, hardened runtime ($APP)"

      - name: "Gate: actual packaged Electron storage and server"
        id: native-smoke
        run: |
          set -euo pipefail
          res="release/mac-arm64/Muster.app/Contents/Resources"
          [ -x "$res/cua-driver" ] || { echo "::error::missing staged cua-driver"; exit 1; }
          lipo -archs "$res/cua-driver" | grep -q "arm64" || {
            echo "::error::cua-driver lacks arm64 slice"; exit 1; }
          node scripts/release-native-smoke.mjs --platform darwin --arch arm64

      # Credential preflight: prove the ASC key authenticates BEFORE spending
      # the build. A bad key otherwise surfaces as notarytool's 401 after the
      # full package step (the v1.15.0 first cut burned 17 minutes learning
      # this). history is a read-only call — no submissions are touched.
      - name: "Gate: notarytool credentials must authenticate"
        if: ${{ success() && needs.prepare.outputs.dry_run == 'false' && env.ASC_KEY_ID != '' && env.ASC_ISSUER_ID != '' && env.ASC_KEY_CONTENT != '' }}
        run: |
          set -euo pipefail
          ASC_KEY_PATH="$RUNNER_TEMP/asc-notary.p8"
          printf '%s\n' "$ASC_KEY_CONTENT" > "$ASC_KEY_PATH"
          chmod 600 "$ASC_KEY_PATH"
          xcrun notarytool history \
            --key "$ASC_KEY_PATH" \
            --key-id "$ASC_KEY_ID" \
            --issuer "$ASC_ISSUER_ID" > /dev/null
          echo "ASC key $ASC_KEY_ID authenticated."

      # Notarization (optional — skipped if secrets are not set)
      - name: Notarize and staple
        id: notarize
        if: ${{ success() && needs.prepare.outputs.dry_run == 'false' && env.ASC_KEY_ID != '' && env.ASC_ISSUER_ID != '' && env.ASC_KEY_CONTENT != '' && env.APPLE_TEAM_ID != '' }}
        run: |
          set -euo pipefail
          # The .p8 is written to the runner temp dir, never the workspace, so
          # it cannot be picked up by an upload or a later checkout step.
          ASC_KEY_PATH="$RUNNER_TEMP/asc-notary.p8"
          printf '%s\n' "$ASC_KEY_CONTENT" > "$ASC_KEY_PATH"
          chmod 600 "$ASC_KEY_PATH"
          for f in release/*.dmg release/*.zip; do
            [ -e "$f" ] || continue
            # A failing substitution under `set -e` would exit before any
            # echo, hiding Apple's reason entirely — capture first and print
            # the full output when notarytool itself fails.
            if ! out=$(xcrun notarytool submit "$f" \
              --key "$ASC_KEY_PATH" \
              --key-id "$ASC_KEY_ID" \
              --issuer "$ASC_ISSUER_ID" \
              --wait 2>&1); then
              echo "$out"
              echo "::error::notarytool submit failed for $f"; exit 1
            fi
            echo "$out" | tail -2
            echo "$out" | grep -q "status: Accepted" || {
              echo "::error::notarization not Accepted for $f"; exit 1; }
          done
          # Staple AFTER acceptance. The .zip is NOT rebuilt from the stapled
          # app — see the scope-limit note at the top of this file.
          for f in release/*.dmg; do
            [ -e "$f" ] || continue
            xcrun stapler staple "$f"
          done
          APP=release/mac-arm64/Muster.app
          xcrun stapler staple "$APP"

      - name: "Gate: notarized app passes Gatekeeper"
        id: gatekeeper
        if: ${{ success() && steps.notarize.outcome == 'success' }}
        run: |
          set -euo pipefail
          APP=release/mac-arm64/Muster.app
          codesign --verify --deep --strict "$APP"
          xcrun stapler validate "$APP"
          spctl --assess --type exec -vv "$APP"

      - name: Refresh Mac update feed after stapling
        id: refresh-feed
        env:
          ASSETS_DIR: release
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          ALLOW_DMG_CHANGE: ${{ steps.notarize.outcome == 'success' }}
        run: node scripts/refresh-mac-feed.mjs

      - name: Clean up keychain
        if: always() && env.KEYCHAIN_PATH != ''
        run: security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true

      # Stable name for the README's /releases/latest/download/Muster.dmg
      # link, and checksums LAST — stapling rewrote the bytes above, so any
      # hash taken before this point describes a file nobody ships.
      - name: Stable-named copy and post-staple checksums
        run: |
          set -euo pipefail
          VERSION=${{ needs.prepare.outputs.version }}
          [ -f "release/Muster-${VERSION}.dmg" ] || {
            echo "::error::expected release/Muster-${VERSION}.dmg (electron-builder.yml dmg.artifactName)"; exit 1; }
          cp "release/Muster-${VERSION}.dmg" release/Muster.dmg
          (cd release && shasum -a 256 *.dmg *.zip > SHA256SUMS-macos-arm64.txt)

      - name: Verify artifacts
        run: |
          set -euo pipefail
          ls -lh release/
          [ -f "release/latest-mac.yml" ] || { echo "::error::missing latest-mac.yml (auto-update feed)"; exit 1; }
          [ -f "release/Muster.dmg" ] || { echo "::error::missing Muster.dmg (stable download name)"; exit 1; }

      - name: Build and verify the standalone CLI
        id: cli-build
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
          CLI_OUT_DIR: release
        run: node scripts/build-cli.mjs

      # Artifact quota on this private repo is 500MB and each platform's
      # bundle is ~500MB — upload-artifact can never fit. The feed files and
      # installer are handed to the publish job through a DRAFT GitHub
      # release keyed to this run instead (tokenless storage, no quota).
      - name: "Attach macOS assets to draft release"
        if: ${{ success() && needs.prepare.outputs.dry_run == 'false' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          set -euo pipefail
          node scripts/release-state.mjs assert-draft
          gh release upload "v$RELEASE_VERSION" release/*.dmg release/*.zip release/*.blockmap release/latest-mac.yml release/SHA256SUMS-macos-arm64.txt "release/Muster-${RELEASE_VERSION}-cli.mjs" release/muster-cli.mjs release/SHA256SUMS-cli.txt --clobber

  # ── macOS (Intel / x64) ───────────────────────────────────────────────────
  # Signed and notarized when the APPLE_CERTIFICATE*/ASC_* secrets are set
  # (same credential set as the arm64 leg); fully unsigned otherwise. Like the
  # arm64 leg it deliberately does NOT touch latest-mac.yml — that feed drives
  # arm64 auto-update, and merging a second architecture into it needs its own
  # verification pass so it can't silently break the update channel that
  # already works.
  macos-x64:
    name: macOS x64 / Intel
    needs: prepare
    runs-on: macos-15-intel
    timeout-minutes: 60
    # Same credential set as the arm64 leg: with the Developer ID cert and the
    # ASC key present the Intel dmg/zip ships signed AND notarized, closing the
    # standing gatekeeper gap where every prior Intel artifact was stapled by
    # hand. Without the secrets the build stays fully unsigned (CSC_IDENTITY_
    # AUTO_DISCOVERY=false) exactly as before, and scripts/notarize-draft-dmg.sh
    # remains the manual fallback.
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4.2.0
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: macos-electron-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: macos-electron-
      - run: pnpm install --frozen-lockfile
      - name: Clean generated output
        run: |
          set -euo pipefail
          rm -rf dist dist-server dist-companion dist-native release
      - name: Import Apple certificate
        if: ${{ env.APPLE_CERTIFICATE != '' }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          CERT_PATH=$RUNNER_TEMP/certificate.p12
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$CERT_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          rm "$CERT_PATH"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      # electron-builder auto-discovers keychain identities by default. On a
      # bare runner (no APPLE_CERTIFICATE imported) that produces a broken
      # partial/ad-hoc signature — hardenedRuntime+entitlements need a real
      # identity, and without one the result is a *worse* state than fully
      # unsigned: Gatekeeper reports the app as damaged. Force a clean, fully
      # unsigned build when there's no real cert.
      - name: Build (macOS x64)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ env.APPLE_CERTIFICATE != '' && 'true' || 'false' }}
          MAC_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
        run: pnpm package:mac:x64

      - name: "Gate: actual packaged Electron storage and server"
        id: native-smoke
        run: |
          set -euo pipefail
          res="release/mac/Muster.app/Contents/Resources"
          [ -x "$res/cua-driver" ] || { echo "::error::missing staged cua-driver"; exit 1; }
          lipo -archs "$res/cua-driver" | grep -q "x86_64" || {
            echo "::error::cua-driver lacks x86_64 slice"; exit 1; }
          node scripts/release-native-smoke.mjs --platform darwin --arch x64

      # Notarization for the Intel dmg/zip, same credential set as the arm64
      # leg. (Historically this leg never notarized — every Intel dmg to date
      # was stapled by hand from the release Mac; scripts/notarize-draft-dmg.sh
      # remains as the fallback when ASC secrets are unset.) The signature
      # gate mirrors the arm64 leg's pre-notarize check.
      - name: "Gate: signature must verify BEFORE notarization"
        if: ${{ success() && needs.prepare.outputs.dry_run == 'false' && env.APPLE_CERTIFICATE != '' && env.ASC_KEY_ID != '' && env.ASC_ISSUER_ID != '' && env.ASC_KEY_CONTENT != '' }}
        run: |
          set -euo pipefail
          APP=release/mac/Muster.app
          codesign --verify --deep --strict "$APP"
          AUTHORITY=$(codesign -dv --verbose=4 "$APP" 2>&1 | awk -F= '/^Authority=Developer ID Application/ {print $2; exit}')
          [ -n "$AUTHORITY" ] || { echo "::error::no Developer ID Application authority — refusing to notarize"; exit 1; }

      - name: Notarize and staple (Intel)
        if: ${{ success() && needs.prepare.outputs.dry_run == 'false' && env.APPLE_CERTIFICATE != '' && env.ASC_KEY_ID != '' && env.ASC_ISSUER_ID != '' && env.ASC_KEY_CONTENT != '' }}
        run: |
          set -euo pipefail
          ASC_KEY_PATH="$RUNNER_TEMP/asc-notary.p8"
          printf '%s\n' "$ASC_KEY_CONTENT" > "$ASC_KEY_PATH"
          chmod 600 "$ASC_KEY_PATH"
          for f in release/*.dmg release/*.zip; do
            [ -e "$f" ] || continue
            if ! out=$(xcrun notarytool submit "$f" \
              --key "$ASC_KEY_PATH" \
              --key-id "$ASC_KEY_ID" \
              --issuer "$ASC_ISSUER_ID" \
              --wait 2>&1); then
              echo "$out"
              echo "::error::notarytool submit failed for $f"; exit 1
            fi
            echo "$out" | grep -q "status: Accepted" || {
              echo "::error::notarization not Accepted for $f"; exit 1; }
          done
          # Staple the dmg only — stapler exits 66 on zips ("incapable of
          # working with ZIP archive files"); the zip's signed payload is
          # already covered by its notarization ticket, same as the arm64 leg.
          for f in release/*.dmg; do
            [ -e "$f" ] || continue
            xcrun stapler staple "$f"
            xcrun stapler validate "$f"
          done

      # Checksums come LAST: stapling rewrites the dmg/zip bytes (the arm64
      # leg documents the same ordering constraint).
      - name: Stable-named copy and checksums
        run: |
          set -euo pipefail
          VERSION=${{ needs.prepare.outputs.version }}
          [ -f "release/Muster-${VERSION}-intel.dmg" ] || {
            echo "::error::expected release/Muster-${VERSION}-intel.dmg (package:mac:x64 override)"; exit 1; }
          cp "release/Muster-${VERSION}-intel.dmg" release/Muster-intel.dmg
          (cd release && shasum -a 256 *.dmg *.zip > SHA256SUMS-macos-x64.txt)

      - name: "Attach macOS x64 assets to draft release"
        if: ${{ success() && needs.prepare.outputs.dry_run == 'false' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          set -euo pipefail
          node scripts/release-state.mjs assert-draft
          gh release upload "v$RELEASE_VERSION" release/*.dmg release/*.zip release/SHA256SUMS-macos-x64.txt --clobber

  # ── Windows ───────────────────────────────────────────────────────────────
  windows:
    name: Windows x64 (NSIS)
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4.2.0
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: windows-electron-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: windows-electron-
      - run: pnpm install --frozen-lockfile
      - name: Clean generated output
        run: rm -rf dist dist-server dist-companion dist-native release
      - run: pnpm package:win

      # Three silent failure modes produce an installer that builds fine and
      # breaks in the field; assert them where the unpacked tree exists.
      - name: "Gate: verify the packaged tree"
        run: |
          set -euo pipefail
          res=release/win-unpacked/resources
          fail=0
          # missing → utilityProcess.fork fails → "couldn't start the server"
          [ -f "$res/server/index.js" ] || { echo "::error::missing $res/server/index.js"; fail=1; }
          # missing → the server has nothing to serve → black window
          [ -f "$res/ui/index.html" ] || { echo "::error::missing $res/ui/index.html"; fail=1; }
          [ -f "$res/app-update.yml" ] || { echo "::error::missing $res/app-update.yml"; fail=1; }
          if [ -f "$res/app-update.yml" ]; then
            # The feed moved to the tokenless generic provider (the VPS
            # download mirror) after the repo went private — a GitHub
            # provider in app-update.yml would 404 for every user. Assert
            # the mirror URL instead of owner/repo.
            grep -q "provider: generic" "$res/app-update.yml" && \
              grep -q "url: https://muster.orazen.online/downloads" "$res/app-update.yml" || {
              echo "::error::app-update.yml does not point at the muster.orazen.online/downloads mirror"; fail=1; }
            if [ -n "$CSC_LINK" ]; then
              grep -q "publisherName" "$res/app-update.yml" || {
                echo "::error::signed build but app-update.yml lacks publisherName — electron-updater would trust nothing"; fail=1; }
            else
              # publisherName on an UNSIGNED build makes electron-updater
              # reject every update as untrusted
              if grep -q "publisherName" "$res/app-update.yml"; then
                echo "::error::app-update.yml carries publisherName on an unsigned build"; fail=1
              fi
            fi
          fi
          exit $fail

      - name: "Gate: actual packaged Electron storage and server"
        id: native-smoke
        run: node scripts/release-native-smoke.mjs --platform win32 --arch x64

      # nsis.artifactName is Muster-${version}-setup.exe — no "-x64-" segment.
      # A past copy referenced one and silently no-op'd; a mismatch must fail.
      - name: Stable-named copy and checksums
        run: |
          set -euo pipefail
          VERSION=${{ needs.prepare.outputs.version }}
          src="release/Muster-${VERSION}-setup.exe"
          [ -f "$src" ] || {
            echo "::error::expected $src (electron-builder.yml nsis.artifactName) — README badge will 404"
            ls -lh release/*.exe 2>/dev/null || true
            exit 1
          }
          cp "$src" release/Muster-setup.exe
          (cd release && sha256sum *.exe > SHA256SUMS-windows-x64.txt)

      - name: "Attach Windows assets to draft release"
        if: ${{ success() && needs.prepare.outputs.dry_run == 'false' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          set -euo pipefail
          node scripts/release-state.mjs assert-draft
          gh release upload "v$RELEASE_VERSION" release/*.exe release/*.exe.blockmap release/latest.yml release/SHA256SUMS-windows-x64.txt --clobber

  # ── Linux ─────────────────────────────────────────────────────────────────
  linux:
    name: Linux x64 (deb + AppImage)
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4.2.0
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: linux-electron-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: linux-electron-
      - name: Install package validation and smoke tools
        run: >-
          sudo apt-get update && sudo apt-get install -y
          desktop-file-utils xvfb dbus-x11
      - run: pnpm install --frozen-lockfile
      - name: Clean generated output
        run: |
          set -euo pipefail
          rm -rf dist dist-server dist-companion dist-native release
      - run: pnpm package:linux

      - name: "Gate: validate the packages"
        run: |
          set -euo pipefail
          node scripts/verify-linux-package.mjs
          # Chromium sandbox needs root-owned setuid in the unpacked tree or
          # the packaged app cannot launch browsers at all
          sudo chown root:root release/linux-unpacked/chrome-sandbox
          sudo chmod 4755 release/linux-unpacked/chrome-sandbox
          test "$(stat -c '%U:%G %a' release/linux-unpacked/chrome-sandbox)" = "root:root 4755"

      - name: "Gate: actual packaged Electron storage and server"
        id: native-smoke
        run: node scripts/release-native-smoke.mjs --platform linux --arch x64

      - name: "Gate: launch the packaged app end-to-end"
        run: dbus-run-session -- xvfb-run -a node scripts/smoke-linux-package.mjs

      - name: Stable-named copies and checksums
        run: |
          set -euo pipefail
          VERSION=${{ needs.prepare.outputs.version }}
          deb=$(ls release/*.deb | head -1)
          appimage=$(ls release/*.AppImage | head -1)
          [ -n "$deb" ] || { echo "::error::no .deb produced"; exit 1; }
          [ -n "$appimage" ] || { echo "::error::no .AppImage produced"; exit 1; }
          cp "$deb" release/Muster.deb
          cp "$appimage" release/Muster.AppImage
          (cd release && sha256sum *.deb *.AppImage > SHA256SUMS-linux-x64.txt)

      - name: "Attach Linux assets to draft release"
        if: ${{ success() && needs.prepare.outputs.dry_run == 'false' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          set -euo pipefail
          node scripts/release-state.mjs assert-draft
          gh release upload "v$RELEASE_VERSION" release/*.deb release/*.AppImage release/latest-linux.yml release/SHA256SUMS-linux-x64.txt --clobber

  # ── Assemble + publish ────────────────────────────────────────────────────
  # Partial core builds stay drafts. Intel is optional; prereleases never
  # promote the stable public mirror even after successful publication.
  publish:
    name: Verify feeds and publish the release
    needs: [prepare, macos, macos-x64, windows, linux]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.dry_run == 'false' && (needs.macos.result == 'success' || needs.linux.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      published: ${{ steps.release.outcome == 'success' && steps.draft.outputs.value == 'false' && !contains(needs.prepare.outputs.version, '-') }}
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
      ASSETS_DIR: assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts

      # Assets arrive via the draft because workflow artifact storage cannot
      # fit this repository's platform packages. State and tag must still match.
      - name: Download verified staging assets
        run: |
          set -euo pipefail
          node scripts/release-state.mjs assert-draft
          mkdir -p assets
          gh release download "v$RELEASE_VERSION" --dir assets --clobber --repo "$GITHUB_REPOSITORY"

      - name: Decide draft state
        id: draft
        env:
          MACOS_RESULT: ${{ needs.macos.result }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
          LINUX_RESULT: ${{ needs.linux.result }}
          INTEL_RESULT: ${{ needs.macos-x64.result }}
        run: node scripts/release-policy.mjs draft

      - name: Verify feed bytes and complete stable downloads
        id: payload
        env:
          REQUIRE_COMPLETE: ${{ steps.draft.outputs.value == 'false' }}
        run: node scripts/release-payload.mjs validate

      - name: Verify the downloaded CLI identity and behavior
        id: cli-verify
        if: ${{ success() && needs.macos.result == 'success' }}
        env:
          CLI_OUT_DIR: assets
        run: node scripts/build-cli.mjs verify

      - name: Recheck draft identity before publication
        run: node scripts/release-state.mjs assert-draft

      - name: Publish the verified release state
        id: release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          target_commitish: ${{ needs.prepare.outputs.sha }}
          name: Muster ${{ needs.prepare.outputs.version }}
          draft: ${{ steps.draft.outputs.value }}
          prerelease: ${{ contains(needs.prepare.outputs.version, '-') }}
          generate_release_notes: true
          body: Built by the Release workflow from Orazen/Muster@${{ needs.prepare.outputs.sha }}.
          files: |
            assets/*

  # ── Deploy published stable download files to VPS ────────────────────────
  # REQUIRED SECRETS: VPS_SSH_KEY and VPS_HOST (default below). The public
  # mirror is inaccessible to draft, prerelease, failed and dry-run jobs.
  deploy-downloads:
    name: Deploy downloads to VPS
    needs: [prepare, publish]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.dry_run == 'false' && needs.publish.result == 'success' && needs.publish.outputs.published == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
      ASSETS_DIR: artifacts
      REQUIRE_COMPLETE: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Download published release assets
        id: download
        run: |
          set -euo pipefail
          node scripts/release-state.mjs assert-published
          mkdir -p artifacts
          gh release download "v$RELEASE_VERSION" --dir artifacts --clobber --repo "$GITHUB_REPOSITORY"
          PUBLISHED_AT="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$RELEASE_VERSION" --jq .published_at)"
          [[ "$PUBLISHED_AT" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]+)?Z$ ]] || {
            echo "::error::published release timestamp is missing or invalid"; exit 1; }
          printf 'published_at=%s\n' "$PUBLISHED_AT" >> "$GITHUB_OUTPUT"

      - name: Validate complete mirror payload and write manifests
        id: payload
        env:
          RELEASE_PUBLISHED_AT: ${{ steps.download.outputs.published_at }}
        run: node scripts/release-payload.mjs mirror

      - name: Deploy to VPS
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          # The deploy target comes only from the VPS_HOST secret — never a
          # fallback literal — so a missing secret fails loudly instead of
          # pointing at an address baked into a public repo.
          test -n "$VPS_HOST" || { echo "::error::VPS_HOST secret is required for mirror deploy"; exit 1; }
          # Recheck remote state immediately before any remote mutation.
          node scripts/release-state.mjs assert-published
          test -s artifacts/mirror-files.txt
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          trap 'rm -f ~/.ssh/deploy_key' EXIT
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          # The public root may be bind-mounted. Never replace that directory
          # or copy a candidate directly over its live aliases.
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ && "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]] || exit 1
          REMOTE_ROOT=/opt/muster-downloads
          STAGE_NAME="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          STAGE="$REMOTE_ROOT/.incoming/$STAGE_NAME"
          MANIFEST_SHA256="$(sha256sum artifacts/mirror-manifest.json | cut -d ' ' -f1)"
          SSH_OPTS="ssh -i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes"
          ssh -i "$HOME/.ssh/deploy_key" -o IdentitiesOnly=yes -o BatchMode=yes "tarun@$VPS_HOST" \
            "python3 - '$REMOTE_ROOT' '$STAGE_NAME'" <<'PY'
          import pathlib, sys
          root = pathlib.Path(sys.argv[1])
          if not root.is_absolute() or root.resolve() != root or not root.is_dir():
              raise SystemExit('The existing public mirror must be a real writable directory')
          incoming = root / '.incoming'
          if incoming.resolve() != incoming:
              raise SystemExit('The incoming mirror directory must not contain links')
          incoming.mkdir(mode=0o755, exist_ok=True)
          if incoming.is_symlink() or not incoming.is_dir():
              raise SystemExit('The incoming mirror directory must not be a link')
          (incoming / sys.argv[2]).mkdir(mode=0o755)
          PY

          # Transfer only the validated inventory to an unused staging path.
          # The remote helper re-hashes all bytes, locks, checks monotonic
          # release identity and atomically switches the current generation.
          rsync -avz --checksum --files-from=artifacts/mirror-files.txt \
            -e "$SSH_OPTS" artifacts/ "tarun@$VPS_HOST:$STAGE/"

          ssh -i "$HOME/.ssh/deploy_key" -o IdentitiesOnly=yes -o BatchMode=yes "tarun@$VPS_HOST" \
            "python3 - --root '$REMOTE_ROOT' --candidate '$STAGE' --version '$RELEASE_VERSION' --sha '$RELEASE_SHA' --manifest-sha256 '$MANIFEST_SHA256'" \
            < scripts/promote-release-mirror.py
