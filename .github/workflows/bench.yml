name: Bench

# Nightly real-server capture with a fake ACP fleet, not a model-quality eval.
# Accumulated history is retained in explicitly identified prior-run artifacts.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

concurrency:
  group: role-eval-history
  cancel-in-progress: false

jobs:
  role-eval:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Download the retained trend history
        id: history
        env:
          GH_TOKEN: ${{ github.token }}
          BENCH_HISTORY_BRANCH: ${{ github.event.repository.default_branch }}
        run: node --experimental-strip-types scripts/bench-trend.ts history history
      - name: Run the per-role capture harness
        id: capture
        env:
          BENCH_TREND_FILE: ${{ github.workspace }}/role-eval-trend.jsonl
        run: |
          set -euo pipefail
          pnpm bench:roles
          test -s role-eval-trend.jsonl
          echo "captured=true" >> "$GITHUB_OUTPUT"
      - name: Merge this run's record into the accumulated history
        id: merge
        run: |
          set -euo pipefail
          mapfile -t prior < <(find history -name 'role-eval-trend.jsonl' -type f | sort)
          node --experimental-strip-types scripts/bench-trend.ts merge "${prior[@]}" role-eval-trend.jsonl --file role-eval-trend.jsonl
      - name: Render the accumulated trend report
        id: report
        run: |
          set -euo pipefail
          node --experimental-strip-types scripts/bench-trend.ts report --file role-eval-trend.jsonl | tee bench-trend-report.txt
      - name: Upload the accumulated history
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: role-eval-trend-${{ github.run_id }}
          path: |
            role-eval-trend.jsonl
            bench-trend-report.txt
          if-no-files-found: error
          retention-days: 90
          overwrite: true
      - name: State capture and persistence separately
        if: always()
        env:
          CAPTURED: ${{ steps.capture.outputs.captured == 'true' }}
          MERGED: ${{ steps.merge.outcome == 'success' }}
          PERSISTED: ${{ steps.upload.outcome == 'success' && steps.upload.outputs.artifact-id != '' }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: |
          {
            echo "## role-eval benchmark"
            echo ""
            echo "- captured this run: $CAPTURED"
            echo "- history merged: $MERGED"
            echo "- history persisted: $PERSISTED"
            echo "- artifact ID: $ARTIFACT_ID"
            echo "- retention: 90 days; a longer gap requires an explicit baseline restart"
            echo "- scope: real server with fake ACP engines; not a model-quality benchmark"
          } >> "$GITHUB_STEP_SUMMARY"
