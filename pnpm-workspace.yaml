# pnpm 11 reads allowBuilds, pnpm 10 reads onlyBuiltDependencies — keep both
# so either version runs the postinstalls this project actually needs.
# A packages list is required for `pnpm list` (electron-builder's collector).
packages:
  - "."
# Keep dependency fixes here, and ONLY here: this file is now the sole source
# of `overrides`. Do not reintroduce `pnpm.overrides` in package.json — that is
# not inert. Measured with pnpm 10.33.0 (`packageManager`) on disposable copies
# via `pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts`:
# when package.json defines `pnpm.overrides`, that block REPLACES this one in
# whole rather than merging with it, so every entry below silently stops
# applying. pnpm still prints "The pnpm field in package.json is no longer read
# by pnpm ... ignored: pnpm.overrides", but the value demonstrably takes effect
# (a root `http-cache-semantics: 4.1.0` resolves 4.1.0, which is in no
# lockfile) — the warning describes the generic settings path, not overrides.
overrides:
  # NOTE: the fast-uri pin that used to sit here ("fast-uri@<3.2.0": "4.1.5")
  # was written against a v4 graph, but this repo actually resolves fast-uri v3
  # (3.1.8), which is what ajv@8.20.0 declares (`fast-uri: ^3.0.1`).
  #
  # That pin was inert in the old layout for a different reason than "pnpm never
  # read it": package.json's `pnpm.overrides` was present at the same time and
  # displaced this whole block, so the pin never ran and the mismatch stayed
  # invisible. Dropping the root field makes THIS block the sole source, which
  # is exactly when the pin would have started to work and forced ajv onto an
  # undeclared major — so it is removed in the same change. Locked 3.1.8 is outside
  # the relevant affected ranges, including GHSA-qw65-cvwx-89v3 (`>=3.0.0,<3.1.7`,
  # patched in 3.1.7) and the other fast-uri advisory ranges (`>=3.0.0,<3.1.6`,
  # `>=3.1.3,<3.1.6`, `>=4.0.0,<4.1.5`, `>=4.1.3,<4.1.5`), so no pin is needed.
  # Raise it only together with the ajv release that declares v4.
  "brace-expansion@<1.1.21": "1.1.21"
  "brace-expansion@>=2.0.0 <2.1.7": "2.1.7"
  "brace-expansion@>=5.0.0 <5.0.12": "5.0.12"
  "@xmldom/xmldom@<0.8.15": "0.8.15"
  "sharp@<0.35.4": ">=0.35.4"
  "js-yaml@<4.3.2": ">=4.3.2"
  # The committed lockfile resolves Miniflare 5.20260930.0-alpha, but this
  # selector targets absent 5.20260923.0-alpha and is therefore unmatched.
  # Confirm the exact graph selector against the lockfile before updating it.
  "miniflare@5.20260923.0-alpha>undici": "7.29.1"
  # Configuration only: tracks the newest published http-cache-semantics, which
  # satisfies cacheable-request's declared `^4.0.0`.
  #
  # This does NOT fix CVE-2026-93748 / GHSA-ch52-4w7c-c8xp, and the published
  # 4.3.0 still carries the flaw. Verified against the registry tarball: 4.3.0's
  # gitHead is b1d4bd682fbab0252985de45219f4e7497c0067c, whose index.js honours
  # `max-stale` for security-zeroed responses and defines no
  # `_requiresRevalidation()` guard. The upstream repair is commit
  # 14a8c2ad51740dc39bf3e8f1a11c845a5003f217, which is not reachable from
  # origin/main and is therefore in no published release. The GHSA still lists
  # "Patched versions: None". Dependabot alert #75 stays open until a release
  # containing that commit ships. Do not read this pin as remediation.
  "http-cache-semantics@<4.3.0": "4.3.0"
allowBuilds:
  electron: true # postinstall downloads the Electron dist
  esbuild: true # postinstall validates the platform binary
  electron-winstaller: false # unused — Windows builds ship NSIS
onlyBuiltDependencies:
  - electron
  - esbuild
