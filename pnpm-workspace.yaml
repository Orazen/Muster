# pnpm 11 reads allowBuilds, pnpm 10 reads onlyBuiltDependencies — keep both
# so either version runs the postinstalls this project actually needs.
# A packages list is required for `pnpm list` (electron-builder's collector).
packages:
  - "."
# Keep dependency fixes here so both pnpm 10 and 11 apply them.
overrides:
  # NOTE: the fast-uri pin that used to sit here ("fast-uri@<3.2.0": "4.1.5")
  # was written against a v4 graph, but this repo actually resolves fast-uri v3
  # (3.1.8), which is what ajv@8.20.0 declares (`fast-uri: ^3.0.1`). Because pnpm
  # never read it, the mismatch stayed invisible; once the overrides block became
  # effective it forced ajv onto an undeclared major. v3.1.8 is below every
  # fast-uri advisory range (`>=3.0.0,<3.1.6`, `>=3.1.3,<3.1.6`,
  # `>=4.0.0,<4.1.5`, `>=4.1.3,<4.1.5`), so no pin is needed. Raise it only
  # together with the ajv release that declares v4.
  "brace-expansion@<1.1.21": "1.1.21"
  "brace-expansion@>=2.0.0 <2.1.7": "2.1.7"
  "brace-expansion@>=5.0.0 <5.0.12": "5.0.12"
  "@xmldom/xmldom@<0.8.15": "0.8.15"
  "sharp@<0.35.4": ">=0.35.4"
  "js-yaml@<4.3.2": ">=4.3.2"
  # This Miniflare version pins 7.29.0; 7.29.1 fixes its six Undici advisories.
  "miniflare@5.20260923.0-alpha>undici": "7.29.1"
  # Configuration only: tracks the newest published http-cache-semantics, which
  # satisfies cacheable-request's declared `^4.0.0`.
  #
  # This does NOT fix CVE-2026-93748 / GHSA-ch52-4w7c-c8xp, and the published
  # 4.3.0 still carries the flaw. Verified against the registry tarball: 4.3.0's
  # gitHead is b1d4bd682fbab0252985de45219f4e7497c0067c, whose index.js honours
  # `max-stale` for security-zeroed responses and defines no
  # `_requiresRevalidation()` guard. The upstream repair is commit
  # 14a8c2ad51740dc39bf3e8f1a11c845a5003f217, which is not reachable from
  # origin/main and is therefore in no published release. The GHSA still lists
  # "Patched versions: None". Dependabot alert #75 stays open until a release
  # containing that commit ships. Do not read this pin as remediation.
  "http-cache-semantics@<4.3.0": "4.3.0"
allowBuilds:
  electron: true # postinstall downloads the Electron dist
  esbuild: true # postinstall validates the platform binary
  electron-winstaller: false # unused — Windows builds ship NSIS
onlyBuiltDependencies:
  - electron
  - esbuild
