# XcodeGen spec. The .xcodeproj is generated, not committed — a project
# file is a merge-conflict machine and nothing in it is worth reviewing.
#
#   brew install xcodegen && cd ios && xcodegen generate && open MusterCompanion.xcodeproj
#
# XcodeGen is a development tool, not a dependency of the app: the app
# itself has none. If you'd rather not install it, make an iOS App target
# in Xcode by hand, add the App/ folder, and add the local CompanionCore
# package — the Info.plist keys below are the part that is easy to miss.
name: MusterCompanion
options:
  bundleIdPrefix: com.muster
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true

packages:
  CompanionCore:
    path: .

targets:
  MusterCompanion:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: CompanionCore
        product: CompanionCore
      # The watch rides inside this bundle for TestFlight. A standalone
      # watch-only app is App Store-eligible but has no beta path at all:
      # Xcode offers only ad-hoc export for it, and altool cannot even name
      # its platform. Embedding is what makes the watch testable.
      - target: MusterWatch
        embed: true
        # Without this the dependency is resolved for the parent's platform,
        # and the build system is asked to build a watchapp2 product type for
        # iOS — which has no such product type. The filter scopes the
        # dependency to watchOS so the watch builds with its own SDK and the
        # Embed Watch Content phase copies the finished bundle.
        platformFilter: watchos
      # The mascot's home-screen home. The extension embeds in the app like
      # the watch does, and reads the fleet snapshot from the shared group.
      - target: MusterFleetWidget
        embed: true
    entitlements:
      path: App/MusterCompanion.entitlements
      properties:
        # Notifications.swift stamps approval pings with
        # interruptionLevel = .timeSensitive. Without this entitlement
        # iOS silently downgrades every one of them to .active — the code
        # reads right and the phone stays quiet at lock screen.
        com.apple.developer.usernotifications.time-sensitive: true
        # The widget extension reads the fleet snapshot through this group
        # (FleetSnapshotStore). Free provisioning creates the group only for
        # explicit team ids; a personal-team build must create it once in
        # the developer portal or the widget shows its placeholder.
        com.apple.security.application-groups:
          - group.com.muster.companion
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.muster.companion
        DEVELOPMENT_TEAM: 7375K23WFU
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "7"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        # The catalog lives in App/, which is already a source path. Generated
        # by `node scripts/make-app-icon.mjs` from the same mascot the app
        # draws, so the icon cannot drift from the thing it depicts.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        # What appears under the icon. Distinct from the desktop app on
        # purpose: someone may well have both, and two identical labels on
        # one person's devices is a small cruelty.
        CFBundleDisplayName: MusterMobile
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: com.muster.companion.pairing
            CFBundleURLSchemes:
              - muster
        # REQUIRED, and easy to lose. Without a launch screen iOS runs the
        # app in compatibility scaling: letterboxed inside black bars, with
        # everything drawn oversized, on every modern iPhone. An empty
        # dictionary is enough — it just has to exist.
        #
        # This cannot be an INFOPLIST_KEY_* build setting. Those are only
        # read when Xcode generates the Info.plist itself, and this target
        # supplies one, so they are silently ignored.
        UILaunchScreen: {}
        # All four, including upside-down portrait, because the target
        # declares iPad support (TARGETED_DEVICE_FAMILY 1,2). App Store
        # Connect rejects an iPad-capable bundle that omits any of them
        # (error 90474) — the app never rotates that way, but the
        # multitasking contract requires the key to allow it.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Explain iOS local-network access and declare the Bonjour service.
        # Local-network privacy permission is separate from ATS; these keys
        # do not establish reachability or guarantee discovery succeeds.
        NSLocalNetworkUsageDescription: >-
          Muster finds your computer on this network so your bots can
          reach you here.
        NSCameraUsageDescription: >-
          Muster uses the camera only to scan a pairing QR code shown on
          your computer.
        # Walkie: push-to-talk transcription and spoken replies. The
        # speech-recognition prompt and the microphone prompt are two
        # separate iOS permissions, and both strings must exist or the app
        # is killed the moment either is requested.
        NSSpeechRecognitionUsageDescription: >-
          Muster converts your voice into messages for your bots while you
          hold the Walkie button.
        NSMicrophoneUsageDescription: >-
          Muster listens only while you hold the Walkie button, so you can
          talk to your bots hands-free.
        NSBonjourServices:
          - _muster._tcp
        # ATS configuration for entered and discovered endpoints. This is
        # not a private-subnet allowlist: NSAllowsLocalNetworking concerns
        # unqualified/.local names and numeric IPv4/IPv6 hosts, with behavior
        # that varies by OS version. iOS 17+ also permits explicit IP/CIDR
        # entries in NSExceptionDomains.
        #
        # The ts.net exception permits HTTP by name, including subdomains;
        # it does not establish tailnet membership or certificate trust.
        # Local-network privacy authorization remains a separate policy.
        # Apple: NSAllowsLocalNetworking, NSExceptionDomains, and TN3179.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            ts.net:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true

  # The watch app. An independent watchOS application target — a single
  # app, no WatchKit extension, no embedded iOS app — because the watch is
  # a companion of the *harness*, not of the phone: pairing, streaming and
  # tokens all come straight from the computer over the network, exactly
  # as the phone does it. (Embedding it in the iOS bundle for a unified
  # App Store listing is a distribution question for later; nothing in the
  # code below assumes either arrangement.)
  #
  # What the watch deliberately does not do, and why: no notification
  # coordinator (a watch app off-screen is not running — local
  # notifications are their own surface, later), no screen watching
  # (base64 desktop captures on a 45mm display is a category error), no
  # search (a keyboard this small should never be asked to compose a
  # query). What remains is what a wrist is good for: glance at the fleet,
  # settle approvals, dictate a short reply.
  MusterWatch:
    # The watch rides inside the iOS bundle (see the dependency on the phone
    # target) because a standalone watch-only app has no TestFlight path.
    # Embedding works with the plain `application` type: the embed phase
    # places the bundle, and the normal link produces the universal watch
    # binary (arm64 + arm64_32) it copies.
    #
    # `application.watchapp2` is deliberately not used. It declares a stub
    # binary and adds a CopyAndPreserveArchs step that writes the same
    # executable path as the linker, so every archive fails with "Multiple
    # commands produce …/MusterWatch.app/MusterWatch". The type is the
    # cause; the embed settings above and below are not.
    type: application
    platform: watchOS
    sources:
      - path: Watch
      # Two files shared verbatim from the phone target, not copied: the
      # keychain wrapper and Bonjour discovery are Foundation/Network only
      # and behave identically on watchOS.
      - path: App/Keychain.swift
      - path: App/Discovery.swift
    dependencies:
      - package: CompanionCore
        product: CompanionCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.muster.companion.watchkitapp
        DEVELOPMENT_TEAM: 7375K23WFU
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "7"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "4"
        # Watch/Assets.xcassets carries the single 1024pt icon. Without a
        # named app icon the catalog is compiled but nothing points at it,
        # and App Store Connect rejects the bundle with 90391/90713 even
        # though the PNG is present.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Embedded, not installed: the container's "Embed Watch Content"
        # phase places the app inside the phone bundle, and a second install
        # into the archive would write the same binary twice.
        SKIP_INSTALL: YES
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: Muster
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Required for iOS 11+ SDK builds; App Store Connect reads this to
        # find the icon in the compiled asset catalog (error 90713).
        CFBundleIconName: AppIcon
        # Single-target watch app: no extension, but now embedded in the iOS
        # bundle so it can reach TestFlight. WKWatchOnly is gone on purpose —
        # an app that declares itself watch-only cannot be embedded, and
        # TestFlight has no other door for a watch app.
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.muster.companion
        # Independent at runtime still: the watch pairs with the computer
        # directly and works whether or not the phone app is installed. This
        # flag is what separates "embedded to be distributable" from "needs
        # the phone", and the pairing and streaming code assumes the former.
        WKRunsIndependentlyOfCompanionApp: true
        # Keep the shared Bonjour declarations. Apple TN3179 does not list
        # watchOS as supporting local-network privacy; do not assume these
        # keys produce an iOS-style permission prompt on the watch.
        NSLocalNetworkUsageDescription: >-
          Muster finds your computer on this network so your bots can
          reach you here.
        NSBonjourServices:
          - _muster._tcp
        # Same ATS configuration as iOS; behavior needs verification on
        # each target OS and is not a private-network access boundary.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            ts.net:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true

  MusterOwnedUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: OwnedUITests
    dependencies:
      - target: MusterCompanion
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.muster.companion.owneduitests
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: MusterCompanion

  MusterWatchOwnedUITests:
    type: bundle.ui-testing
    platform: watchOS
    sources:
      - path: WatchOwnedUITests
    dependencies:
      - target: MusterWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.muster.companion.watchowneduitests
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: MusterWatch

  # The mascot outside the app: a home-screen widget (small + medium) that
  # renders the fleet snapshot the app publishes to the shared app group.
  # No in-extension networking: the widget is a renderer, the app is the
  # source of truth — one character, one voice, no second transport.
  MusterFleetWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: App/FleetWidget.swift
    dependencies:
      - package: CompanionCore
        product: CompanionCore
    entitlements:
      path: App/FleetWidget.entitlements
      properties:
        # The widget is a renderer that reads the fleet snapshot the app
        # publishes (FleetSnapshotStore). Without this entitlement its
        # UserDefaults(suiteName:) returns nil and the mascot widget shows
        # its placeholder forever, no matter what the app publishes.
        # Extension and container must both carry the same group.
        com.apple.security.application-groups:
          - group.com.muster.companion
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.muster.companion.fleetwidget
        DEVELOPMENT_TEAM: 7375K23WFU
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "7"
        SWIFT_VERSION: "5.9"
        SKIP_INSTALL: YES
        # This target compiles App/FleetWidget.swift, which is also compiled
        # into the app (whose sources are all of App/). The condition gates
        # the extension's @main WidgetBundle so each module gets exactly one
        # entry point — without it the appex shipped with no __swift5_entry
        # section and App Store validation rejected the upload (error 90896).
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: WIDGET_EXTENSION
    info:
      path: App/FleetWidgetInfo.plist
      properties:
        CFBundleDisplayName: Muster mascot
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

schemes:
  # The app's own scheme. Without it there is no way to archive MusterCompanion
  # for distribution — `xcodebuild archive` wants a scheme, and the only ones
  # that existed built the package, the watch, or the test harness. Release
  # config so the archive is the thing that ships.
  MusterCompanion:
    build:
      targets:
        MusterCompanion: all
    run:
      config: Debug
    archive:
      config: Release
  MusterOwnedAcceptance:
    build:
      targets:
        MusterCompanion: all
        MusterOwnedUITests: [test]
    test:
      targets:
        - MusterOwnedUITests
      gatherCoverageData: false
  MusterWatchOwnedAcceptance:
    build:
      targets:
        MusterWatch: all
        MusterWatchOwnedUITests: [test]
    test:
      targets:
        - MusterWatchOwnedUITests
      gatherCoverageData: false
