# XcodeGen spec. The .xcodeproj is generated, not committed — a project
# file is a merge-conflict machine and nothing in it is worth reviewing.
#
#   brew install xcodegen && cd ios && xcodegen generate && open MusterCompanion.xcodeproj
#
# XcodeGen is a development tool, not a dependency of the app: the app
# itself has none. If you'd rather not install it, make an iOS App target
# in Xcode by hand, add the App/ folder, and add the local CompanionCore
# package — the Info.plist keys below are the part that is easy to miss.
name: MusterCompanion
options:
  bundleIdPrefix: com.muster
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true

packages:
  CompanionCore:
    path: .

targets:
  MusterCompanion:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: CompanionCore
        product: CompanionCore
    entitlements:
      path: App/MusterCompanion.entitlements
      properties:
        # Notifications.swift stamps approval pings with
        # interruptionLevel = .timeSensitive. Without this entitlement
        # iOS silently downgrades every one of them to .active — the code
        # reads right and the phone stays quiet at lock screen.
        com.apple.developer.usernotifications.time-sensitive: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.muster.companion
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        # The catalog lives in App/, which is already a source path. Generated
        # by `node scripts/make-app-icon.mjs` from the same mascot the app
        # draws, so the icon cannot drift from the thing it depicts.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        # What appears under the icon. Distinct from the desktop app on
        # purpose: someone may well have both, and two identical labels on
        # one person's devices is a small cruelty.
        CFBundleDisplayName: MusterMobile
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: com.muster.companion.pairing
            CFBundleURLSchemes:
              - muster
        # REQUIRED, and easy to lose. Without a launch screen iOS runs the
        # app in compatibility scaling: letterboxed inside black bars, with
        # everything drawn oversized, on every modern iPhone. An empty
        # dictionary is enough — it just has to exist.
        #
        # This cannot be an INFOPLIST_KEY_* build setting. Those are only
        # read when Xcode generates the Info.plist itself, and this target
        # supplies one, so they are silently ignored.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Without these two, NWBrowser returns no results at all — silently.
        # It looks exactly like "no computers on this network", which is a
        # confusing hour if you don't know to look here.
        NSLocalNetworkUsageDescription: >-
          Muster finds your computer on this network so your bots can
          reach you here.
        NSCameraUsageDescription: >-
          Muster uses the camera only to scan a pairing QR code shown on
          your computer.
        NSBonjourServices:
          - _muster._tcp
        # The companion listener is plain HTTP on a local address. ATS has
        # to be told, and this is the narrowest way to say it: local
        # networking only, not a blanket exception.
        #
        # NSAllowsLocalNetworking covers the private ranges — 10/8,
        # 172.16/12, 192.168/16, .local — and that is the whole LAN story.
        # It does *not* cover Tailscale: a tailnet address lives in
        # 100.64.0.0/10, the CGNAT range, which ATS treats as ordinary
        # public internet and blocks over plain HTTP. The address cannot be
        # exempted (ATS exceptions are by name, not by subnet), but the
        # MagicDNS name can be, and every tailnet name ends in ts.net — so
        # connect by name and this one entry covers every machine you own.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            ts.net:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true

  # The watch app. An independent watchOS application target — a single
  # app, no WatchKit extension, no embedded iOS app — because the watch is
  # a companion of the *harness*, not of the phone: pairing, streaming and
  # tokens all come straight from the computer over the network, exactly
  # as the phone does it. (Embedding it in the iOS bundle for a unified
  # App Store listing is a distribution question for later; nothing in the
  # code below assumes either arrangement.)
  #
  # What the watch deliberately does not do, and why: no notification
  # coordinator (a watch app off-screen is not running — local
  # notifications are their own surface, later), no screen watching
  # (base64 desktop captures on a 45mm display is a category error), no
  # search (a keyboard this small should never be asked to compose a
  # query). What remains is what a wrist is good for: glance at the fleet,
  # settle approvals, dictate a short reply.
  MusterWatch:
    type: application
    platform: watchOS
    sources:
      - path: Watch
      # Two files shared verbatim from the phone target, not copied: the
      # keychain wrapper and Bonjour discovery are Foundation/Network only
      # and behave identically on watchOS.
      - path: App/Keychain.swift
      - path: App/Discovery.swift
    dependencies:
      - package: CompanionCore
        product: CompanionCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.muster.companion.watchkitapp
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "4"
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: Muster
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Single-target watch app: no extension, no companion embedding.
        WKApplication: true
        WKRunsIndependentlyOfCompanionApp: true
        # Same silent-empty-list failure mode as the phone: without these
        # two keys NWBrowser returns nothing and looks like "no computers".
        NSLocalNetworkUsageDescription: >-
          Muster finds your computer on this network so your bots can
          reach you here.
        NSBonjourServices:
          - _muster._tcp
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            ts.net:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true
