<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Muster</title>
  <desc id="desc">A five-pointed star in the Muster accent gradient, with the agent team clustered at its heart — the Muster mark.</desc>

  <defs>
