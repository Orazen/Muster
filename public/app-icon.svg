    <linearGradient id="star-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0"   stop-color="#FF9A73" />
      <stop offset="0.45" stop-color="#F0460E" />
      <stop offset="1"   stop-color="#8F2A08" />
    </linearGradient>

    <radialGradient id="star-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0"   stop-color="#F0460E" stop-opacity="0.30" />
      <stop offset="1"   stop-color="#F0460E" stop-opacity="0" />
