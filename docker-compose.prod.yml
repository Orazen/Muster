version: '3.8'

services:
  muster:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8799:8799"
    environment:
      - NODE_ENV=production
      - OMB_HOST=0.0.0.0
      - OMB_PORT=8799
      # DOMAIN must be set in the deployment environment. If it is empty the
      # public origin never reaches better-auth's trustedOrigins and every
      # email sign-in 403s with INVALID_ORIGIN — so default to the known
      # production host rather than silently deploying broken auth.
      - OMB_PUBLIC_HOST=${DOMAIN:-muster.orazen.online}
      # Referral loop needs self-serve accounts. Override with
      # OMB_ALLOW_SIGNUPS=false to close them again.
      - OMB_ALLOW_SIGNUPS=${OMB_ALLOW_SIGNUPS:-true}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
    volumes:
      - muster-data:/data
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8799/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.muster.rule=Host(${DOMAIN})"
      - "traefik.http.routers.muster.tls=true"

volumes:
  muster-data:
