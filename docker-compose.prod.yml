version: '3.8'

services:
  muster:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8799:8799"
    environment:
      - NODE_ENV=production
      - OMB_HOST=0.0.0.0
      - OMB_PORT=8799
      # DOMAIN must be set in the deployment environment. If it is empty the
      # public origin never reaches better-auth's trustedOrigins and every
      # email sign-in 403s with INVALID_ORIGIN — so default to the known
      # production host rather than silently deploying broken auth.
      - OMB_PUBLIC_HOST=${DOMAIN:-muster.orazen.online}
      # Referral loop needs self-serve accounts. Override with
      # OMB_ALLOW_SIGNUPS=false to close them again.
      - OMB_ALLOW_SIGNUPS=${OMB_ALLOW_SIGNUPS:-true}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      # Outbound email. `isEmailConfigured()` (server/email.ts) is exactly
      # `Boolean(RESEND_API_KEY)`, and the auth capability route advertises
      # `emailOtp` from it — so with these absent the deployment serves a
      # sign-in screen that hides email codes instead of mailing them. Compose
      # only passes what is listed here, so a value set in the hosting panel's
      # env UI does NOT reach the container unless it is named below. The
      # default keeps an unset deployment behaviourally identical to the
      # previous one — the two keys now exist but are empty, and an empty
      # RESEND_API_KEY is falsy exactly like an absent one.
      - RESEND_API_KEY=${RESEND_API_KEY}
      - EMAIL_FROM=${EMAIL_FROM:-Muster <noreply@localhost>}
    volumes:
      - muster-data:/data
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8799/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.muster.rule=Host(${DOMAIN})"
      - "traefik.http.routers.muster.tls=true"

volumes:
  muster-data:
